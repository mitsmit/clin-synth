    gender:
      proportions:
        Female:          0.5376
        Male:            0.4624
        Unknown/Invalid: 0.00003
    age:
      proportions:
        "[70-80)":  0.2562
        "[60-70)":  0.2209
        "[80-90)":  0.1690
        "[50-60)":  0.1696
        "[40-50)":  0.0952
        "[30-40)":  0.0371
        "[20-30)":  0.0163
        "[90-100)": 0.0274
        "[10-20)":  0.0068
        "[0-10)":   0.0016
    metformin:
      proportions:
        No:     0.8036
        Steady: 0.1803
