[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-synth"
version = "0.1.0"
description = "Statistics-first, privacy-preserving synthetic data generation using LLMs"
authors = [{ name = "Smitashree Choudhury" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tstr   = ["scikit-learn>=1.4"]
plots  = ["seaborn>=0.13", "matplotlib>=3.7"]
dev    = ["pytest>=8.0", "ruff>=0.4"]
all    = ["llm-synth[tstr,plots,dev]"]

[project.scripts]
llm-synth = "llm_synth.cli.run:main"

[tool.setuptools.packages.find]
where     = ["."]
include   = ["llm_synth*"]

[tool.setuptools.package-data]
llm_synth = ["prompts/*.md"]
